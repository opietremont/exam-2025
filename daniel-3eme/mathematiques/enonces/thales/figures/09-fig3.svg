<svg width="520" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Figure Q6 feuille 9 : triangle DEF, P milieu de [DE], Q milieu de [DF], G = (FP)∩(EQ) -->
  <polygon points="260,40 80,350 440,350" fill="none" stroke="black" stroke-width="2"/>

  <!-- mediane FP -->
  <line x1="440" y1="350" x2="170" y2="195" stroke="blue" stroke-width="1.8"/>
  <!-- mediane EQ -->
  <line x1="80" y1="350" x2="350" y2="195" stroke="purple" stroke-width="1.8"/>
  <!-- segment PQ -->
  <line x1="170" y1="195" x2="350" y2="195" stroke="green" stroke-width="1.8" stroke-dasharray="5,3"/>

  <circle cx="260" cy="40" r="4" fill="black"/>
  <circle cx="80" cy="350" r="4" fill="black"/>
  <circle cx="440" cy="350" r="4" fill="black"/>
  <circle cx="170" cy="195" r="4" fill="red"/>
  <circle cx="350" cy="195" r="4" fill="red"/>
  <circle cx="260" cy="247" r="4" fill="darkorange"/>

  <text x="250" y="28" font-size="16" font-weight="bold">D</text>
  <text x="55" y="370" font-size="16" font-weight="bold">E</text>
  <text x="448" y="370" font-size="16" font-weight="bold">F</text>
  <text x="140" y="190" font-size="15" font-weight="bold" fill="red">P</text>
  <text x="358" y="190" font-size="15" font-weight="bold" fill="red">Q</text>
  <text x="267" y="250" font-size="15" font-weight="bold" fill="darkorange">G</text>

  <text x="55" y="25" font-size="11" fill="gray">P milieu de [DE] ; Q milieu de [DF]</text>
  <text x="55" y="40" font-size="11" fill="gray">Figure non à l'échelle</text>
</svg>
