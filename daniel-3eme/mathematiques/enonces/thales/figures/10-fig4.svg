<svg width="520" height="420" xmlns="http://www.w3.org/2000/svg">
  <!-- Figure Q5-Q6 feuille 10 : quadrilatère ABCD quelconque, E,F,G,H milieux des côtés -->
  <polygon points="100,320 300,80 460,220 220,380" fill="none" stroke="black" stroke-width="2"/>

  <!-- diagonales, en pointillés -->
  <line x1="100" y1="320" x2="460" y2="220" stroke="gray" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="300" y1="80" x2="220" y2="380" stroke="gray" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- quadrilatère EFGH -->
  <polygon points="200,200 380,150 340,300 160,350" fill="none" stroke="blue" stroke-width="2"/>

  <circle cx="100" cy="320" r="4" fill="black"/>
  <circle cx="300" cy="80" r="4" fill="black"/>
  <circle cx="460" cy="220" r="4" fill="black"/>
  <circle cx="220" cy="380" r="4" fill="black"/>
  <circle cx="200" cy="200" r="4" fill="blue"/>
  <circle cx="380" cy="150" r="4" fill="blue"/>
  <circle cx="340" cy="300" r="4" fill="blue"/>
  <circle cx="160" cy="350" r="4" fill="blue"/>

  <text x="78" y="340" font-size="16" font-weight="bold">A</text>
  <text x="292" y="68" font-size="16" font-weight="bold">B</text>
  <text x="468" y="215" font-size="16" font-weight="bold">C</text>
  <text x="225" y="400" font-size="16" font-weight="bold">D</text>
  <text x="178" y="195" font-size="14" font-weight="bold" fill="blue">E</text>
  <text x="386" y="146" font-size="14" font-weight="bold" fill="blue">F</text>
  <text x="346" y="318" font-size="14" font-weight="bold" fill="blue">G</text>
  <text x="128" y="348" font-size="14" font-weight="bold" fill="blue">H</text>

  <text x="55" y="25" font-size="11" fill="gray">E,F,G,H milieux de [AB],[BC],[CD],[DA] ; figure non à l'échelle</text>
</svg>
