<svg width="480" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Figure Q7 feuille 9 : triangle isocèle ABC, rectangle RSTU inscrit -->
  <polygon points="230,60 60,320 400,320" fill="none" stroke="black" stroke-width="2"/>

  <!-- hauteur AH -->
  <line x1="230" y1="60" x2="230" y2="320" stroke="gray" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- rectangle RSTU -->
  <polygon points="187.5,125 272.5,125 272.5,320 187.5,320" fill="none" stroke="blue" stroke-width="1.8"/>

  <circle cx="230" cy="60" r="4" fill="black"/>
  <circle cx="60" cy="320" r="4" fill="black"/>
  <circle cx="400" cy="320" r="4" fill="black"/>
  <circle cx="230" cy="320" r="4" fill="gray"/>
  <circle cx="187.5" cy="125" r="4" fill="blue"/>
  <circle cx="272.5" cy="125" r="4" fill="blue"/>
  <circle cx="187.5" cy="320" r="4" fill="blue"/>
  <circle cx="272.5" cy="320" r="4" fill="blue"/>

  <text x="222" y="48" font-size="16" font-weight="bold">A</text>
  <text x="38" y="340" font-size="16" font-weight="bold">B</text>
  <text x="408" y="340" font-size="16" font-weight="bold">C</text>
  <text x="235" y="335" font-size="13" fill="gray">H</text>
  <text x="160" y="118" font-size="14" font-weight="bold" fill="blue">R</text>
  <text x="278" y="118" font-size="14" font-weight="bold" fill="blue">S</text>
  <text x="155" y="340" font-size="14" font-weight="bold" fill="blue">U</text>
  <text x="278" y="340" font-size="14" font-weight="bold" fill="blue">T</text>

  <text x="60" y="230" font-size="12">AB = AC = 20 cm</text>
  <text x="180" y="360" font-size="12">BC = 24 cm</text>
  <text x="115" y="335" font-size="12" fill="blue">x</text>

  <text x="60" y="30" font-size="11" fill="gray">RSTU rectangle, U et T sur [BC], R sur [AB], S sur [AC]</text>
  <text x="60" y="45" font-size="11" fill="gray">BU = x ; figure non à l'échelle</text>
</svg>
