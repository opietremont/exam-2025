<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Figure Q9 feuille 9 : trapèze rectangle ABCD, O intersection des diagonales -->
  <polygon points="60,320 180,320 240,60 60,60" fill="none" stroke="black" stroke-width="2"/>

  <!-- diagonales -->
  <line x1="180" y1="320" x2="60" y2="60" stroke="blue" stroke-width="1.5"/>
  <line x1="60" y1="320" x2="240" y2="60" stroke="blue" stroke-width="1.5"/>

  <!-- angles droits en B et C -->
  <rect x="60" y="308" width="12" height="12" fill="none" stroke="black" stroke-width="1.3"/>
  <rect x="60" y="60" width="12" height="12" fill="none" stroke="black" stroke-width="1.3"/>

  <circle cx="60" cy="320" r="4" fill="black"/>
  <circle cx="180" cy="320" r="4" fill="black"/>
  <circle cx="240" cy="60" r="4" fill="black"/>
  <circle cx="60" cy="60" r="4" fill="black"/>
  <circle cx="132" cy="216" r="4" fill="darkorange"/>
  <circle cx="60" cy="216" r="4" fill="green"/>

  <!-- segment OH -->
  <line x1="132" y1="216" x2="60" y2="216" stroke="green" stroke-width="1.6" stroke-dasharray="5,3"/>

  <text x="40" y="340" font-size="16" font-weight="bold">B</text>
  <text x="188" y="340" font-size="16" font-weight="bold">A</text>
  <text x="248" y="55" font-size="16" font-weight="bold">D</text>
  <text x="40" y="55" font-size="16" font-weight="bold">C</text>
  <text x="138" y="212" font-size="15" font-weight="bold" fill="darkorange">O</text>
  <text x="38" y="212" font-size="15" font-weight="bold" fill="green">H</text>

  <text x="90" y="340" font-size="12">AB = 4 cm</text>
  <text x="130" y="55" font-size="12">DC = 6 cm</text>
  <text x="10" y="190" font-size="12">BC = 7 cm</text>
  <text x="80" y="210" font-size="12" fill="green">d</text>

  <text x="70" y="25" font-size="11" fill="gray">Trapèze rectangle en B et C ; figure non à l'échelle</text>
</svg>
