<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Figure Q8 feuille 9 : point O, ray1 = O,X,Y,Z ; ray2 = O,P,Q,R -->
  <line x1="60" y1="30" x2="60" y2="370" stroke="black" stroke-width="2"/>
  <line x1="60" y1="30" x2="460" y2="370" stroke="black" stroke-width="2"/>

  <!-- (XQ) // (YR) -->
  <line x1="60" y1="98" x2="300" y2="234" stroke="blue" stroke-width="1.8"/>
  <line x1="60" y1="143.3" x2="460" y2="370" stroke="blue" stroke-width="1.8" stroke-dasharray="6,3"/>
  <!-- (YP) // (ZQ) -->
  <line x1="60" y1="143.3" x2="140" y2="98" stroke="green" stroke-width="1.8"/>
  <line x1="60" y1="370" x2="300" y2="234" stroke="green" stroke-width="1.8" stroke-dasharray="6,3"/>

  <circle cx="60" cy="30" r="4" fill="black"/>
  <circle cx="60" cy="98" r="4" fill="black"/>
  <circle cx="60" cy="143.3" r="4" fill="black"/>
  <circle cx="60" cy="370" r="4" fill="black"/>
  <circle cx="140" cy="98" r="4" fill="black"/>
  <circle cx="300" cy="234" r="4" fill="black"/>
  <circle cx="460" cy="370" r="4" fill="black"/>

  <text x="38" y="25" font-size="16" font-weight="bold">O</text>
  <text x="35" y="95" font-size="15" font-weight="bold">X</text>
  <text x="35" y="148" font-size="15" font-weight="bold">Y</text>
  <text x="35" y="388" font-size="15" font-weight="bold">Z</text>
  <text x="145" y="92" font-size="15" font-weight="bold">P</text>
  <text x="305" y="230" font-size="15" font-weight="bold">Q</text>
  <text x="466" y="372" font-size="15" font-weight="bold">R</text>

  <text x="150" y="160" font-size="12" fill="blue">(XQ) // (YR)</text>
  <text x="150" y="330" font-size="12" fill="green">(YP) // (ZQ)</text>
  <text x="200" y="40" font-size="11" fill="gray">Figure non à l'échelle</text>
