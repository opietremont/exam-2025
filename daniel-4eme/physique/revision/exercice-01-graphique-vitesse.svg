<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="Arial, sans-serif" font-size="12">

  <!-- Titre -->
  <text x="345" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Distance d'arrêt en fonction de la vitesse</text>

  <!-- Zone de tracé -->
  <rect x="70" y="30" width="550" height="330" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>

  <!-- Grille verticale -->
  <line x1="266" y1="30" x2="266" y2="360" stroke="#ddd" stroke-dasharray="4,4"/>
  <line x1="424" y1="30" x2="424" y2="360" stroke="#ddd" stroke-dasharray="4,4"/>
  <line x1="581" y1="30" x2="581" y2="360" stroke="#ddd" stroke-dasharray="4,4"/>

  <!-- Grille horizontale -->
  <line x1="70" y1="273" x2="620" y2="273" stroke="#ddd" stroke-dasharray="4,4"/>
  <line x1="70" y1="186" x2="620" y2="186" stroke="#ddd" stroke-dasharray="4,4"/>
  <line x1="70" y1="100" x2="620" y2="100" stroke="#ddd" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <line x1="70" y1="360" x2="625" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="360" x2="70" y2="25" stroke="#333" stroke-width="2"/>

  <!-- Flèches axes -->
  <polygon points="625,356 635,360 625,364" fill="#333"/>
  <polygon points="66,25 70,15 74,25" fill="#333"/>

  <!-- Graduations axe X -->
  <line x1="266" y1="360" x2="266" y2="368" stroke="#333" stroke-width="1.5"/>
  <text x="266" y="383" text-anchor="middle" fill="#333">50</text>
  <line x1="424" y1="360" x2="424" y2="368" stroke="#333" stroke-width="1.5"/>
  <text x="424" y="383" text-anchor="middle" fill="#333">90</text>
  <line x1="581" y1="360" x2="581" y2="368" stroke="#333" stroke-width="1.5"/>
  <text x="581" y="383" text-anchor="middle" fill="#333">130</text>
  <text x="70" y="383" text-anchor="middle" fill="#333">0</text>
  <text x="345" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Vitesse (km/h)</text>

  <!-- Graduations axe Y -->
  <line x1="70" y1="273" x2="62" y2="273" stroke="#333" stroke-width="1.5"/>
  <text x="57" y="277" text-anchor="end" fill="#333">50</text>
  <line x1="70" y1="186" x2="62" y2="186" stroke="#333" stroke-width="1.5"/>
  <text x="57" y="190" text-anchor="end" fill="#333">100</text>
  <line x1="70" y1="100" x2="62" y2="100" stroke="#333" stroke-width="1.5"/>
  <text x="57" y="104" text-anchor="end" fill="#333">150</text>
  <text x="57" y="364" text-anchor="end" fill="#333">0</text>
  <text x="18" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" transform="rotate(-90,18,195)">Distance (m)</text>

  <!-- Courbe : distance de réaction (orange, tiretée) — identique sec et pluie -->
  <polyline points="70,360 266,336 424,317 581,298"
            fill="none" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="10,5"
            stroke-linejoin="round"/>

  <!-- Courbe : freinage temps sec (bleu) -->
  <polyline points="70,360 266,336 424,282 581,193"
            fill="none" stroke="#2980b9" stroke-width="2.5"
            stroke-linejoin="round"/>

  <!-- Courbe : freinage temps de pluie (rouge) -->
  <polyline points="70,360 266,322 424,238 581,100"
            fill="none" stroke="#e74c3c" stroke-width="2.5"
            stroke-linejoin="round"/>

  <!-- Points : réaction -->
  <circle cx="266" cy="336" r="4" fill="#e67e22"/>
  <circle cx="424" cy="317" r="4" fill="#e67e22"/>
  <circle cx="581" cy="298" r="4" fill="#e67e22"/>

  <!-- Points : freinage sec -->
  <circle cx="266" cy="336" r="4" fill="#2980b9"/>
  <circle cx="424" cy="282" r="4" fill="#2980b9"/>
  <circle cx="581" cy="193" r="4" fill="#2980b9"/>

  <!-- Points : freinage pluie -->
  <circle cx="266" cy="322" r="4" fill="#e74c3c"/>
  <circle cx="424" cy="238" r="4" fill="#e74c3c"/>
  <circle cx="581" cy="100" r="4" fill="#e74c3c"/>

  <!-- Légende -->
  <rect x="290" y="38" width="220" height="78" fill="white" stroke="#ccc" rx="5"/>
  <line x1="300" y1="57" x2="328" y2="57" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="8,4"/>
  <circle cx="314" cy="57" r="4" fill="#e67e22"/>
  <text x="334" y="61" font-size="11" fill="#333">Réaction (sec et pluie)</text>
  <line x1="300" y1="77" x2="328" y2="77" stroke="#2980b9" stroke-width="2.5"/>
  <circle cx="314" cy="77" r="4" fill="#2980b9"/>
  <text x="334" y="81" font-size="11" fill="#333">Freinage — temps sec</text>
  <line x1="300" y1="97" x2="328" y2="97" stroke="#e74c3c" stroke-width="2.5"/>
  <circle cx="314" cy="97" r="4" fill="#e74c3c"/>
  <text x="334" y="101" font-size="11" fill="#333">Freinage — temps de pluie</text>

</svg>
